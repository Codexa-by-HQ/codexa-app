<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!--
    `viewport-fit=cover` lets the page paint under the notch and the home
    indicator, and is what makes `env(safe-area-inset-*)` report anything other
    than 0px. `interactive-widget=resizes-content` makes the Android keyboard
    shrink the layout viewport, so `dvh` and bottom-pinned UI react to it the
    way they already do on iOS.
  -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

  <title>Codexa App</title>
  <meta name="description" content="Codexa secure oauth app." />

  <!-- External, not inline: the setup server's CSP is `script-src 'self'`. -->
  <script src="/boot.js"></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
